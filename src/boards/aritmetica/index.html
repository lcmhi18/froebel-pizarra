<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aritmética de Primaria · Froebel Academy</title>
<style>
:root{--bg:#f1f5fc;--cd:#fff;--tx:#1b2a41;--so:#5b6b85;--bd:#d3dcee;--pr:#1f5fbf;--ow:#fff3d6;color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1520;--cd:#1a2333;--tx:#e6ecf7;--so:#9fb0cc;--bd:#2f3b52;--pr:#6aa2ff;--ow:#3a3220;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0f1520;--cd:#1a2333;--tx:#e6ecf7;--so:#9fb0cc;--bd:#2f3b52;--pr:#6aa2ff;--ow:#3a3220;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:5px 9px;cursor:pointer}
input,select,textarea{background:var(--cd);border:1px solid var(--bd);border-radius:6px;padding:4px 6px}
:focus-visible{outline:3px solid var(--pr)}
.on{background:#facc15!important;color:#1b2a41!important;border-color:#eab308!important}
#top{background:#1f5fbf;color:#fff;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px}
#top b{flex:1;min-width:200px;font-size:16px}
#top button{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4);color:#fff}
.bar{background:var(--cd);border-bottom:1px solid var(--bd);padding:6px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sep{width:1px;align-self:stretch;background:var(--bd);margin:0 2px}
#stage{flex:1;min-height:0;position:relative;margin:6px 10px;border:2px solid var(--bd);border-radius:10px;background:var(--cd);overflow:hidden}
#stage.sc{overflow:auto}
#vs{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#vs.ov{width:1000px;height:560px;z-index:2}
#vs.ov{pointer-events:none}
#vs.ov.cap{pointer-events:auto}
#vs .it,#vs .hd{pointer-events:visiblePainted;touch-action:none}
#vs .dc{pointer-events:none}
#cm{padding:12px;position:relative;min-width:1000px;min-height:560px}
#bot{max-height:38vh;overflow:auto;background:var(--cd);border-top:1px solid var(--bd);padding:6px 10px;display:flex;flex-direction:column;gap:6px}
body.big #bot{max-height:30vh}
body.big #owl{display:none}
#owl{display:flex;gap:8px;align-items:center}
#owl .o{font-size:26px}
#msg{background:var(--ow);border-radius:10px;padding:8px 10px;flex:1}
.pal{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pal .lb{color:var(--so);font-size:13px;margin-right:4px}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--bd);padding:0}
.sw.ring{box-shadow:0 0 0 3px var(--pr)}
#cpick{width:34px;height:28px;padding:0}
#ctx{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:0}
#ctx .nt{color:var(--so);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:6px 0}
.chip{border:2px solid #2563eb;border-radius:16px;padding:3px 12px;margin:2px}
.chip.b{border-color:#e03e3e}
table{border-collapse:collapse}
td,th{border:1px solid var(--bd);padding:3px 6px;text-align:center}
svg{max-width:100%}
.s{fill:var(--tx);font-size:15px;text-anchor:middle}
.ax{stroke:var(--so);stroke-width:2}
.sub{color:var(--so);font-size:13px}
.dvb{position:relative}
.dvb input{position:absolute;width:60px;height:38px;font-size:22px;font-weight:700;text-align:center;border:none;background:transparent;padding:0}
</style>
</head>
<body>
<header id="top"><a class="geo-brand" href="/" aria-label="Froebel Academy, inicio"><img src="/src/assets/img/header-mobile.webp" alt="Froebel Academy"></a><b>🧮 Aritmética de Primaria · Froebel Academy</b><span id="room-status"></span><button id="hide-upper">Ocultar menú superior</button><button id="hide-lower">Ocultar menú inferior</button><div id="live-slot"></div>
<button data-a="big" id="bBig">🔍 Pizarra grande</button><button data-a="undo">↩ Deshacer</button><button data-a="snap" id="bSnap">🧲 Imán</button><button data-a="clear">🗑️ Limpiar</button></header><main id="arithmetic-workspace">
<div class="bar" id="tabs"></div>
<div class="bar" id="tools"></div>
<div id="stage"><svg role="img" aria-label="Pizarra de aritmética interactiva" id="vs" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet"></svg><div id="cm"></div></div>
<div id="bot"><div id="owl"><span class="o">🦉</span><div id="msg"></div></div><div class="pal" id="pal"></div><div id="ctx"></div></div>

</main><script type="module" src="./main.js"></script>
</body>
</html>
