<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pizarra de prueba · Froebel Academy</title><link rel="icon" type="image/webp" href="/src/assets/img/header-mobile.webp"></head>
<body><header class="board-header"><a class="brand" href="/" aria-label="Froebel Academy, inicio"><img src="/src/assets/img/header-mobile.webp" alt="Froebel Academy"></a><div class="board-heading"><h1>Pizarra compartida</h1><span>Froebel Academy</span></div><div id="live-slot" aria-label="Sala en vivo"></div></header>
<main id="board-workspace"><section class="toolbox" aria-label="Herramientas de la pizarra"><div id="tools" class="tools" role="toolbar" aria-label="Dibujar y editar"></div><div class="text-options" id="text-options" hidden><label>Escribe tu texto<input id="board-text" aria-label="Texto para la pizarra" maxlength="200" value="Hola, clase"></label></div><div class="size-options" id="size-options" hidden><label>Tamaño del círculo <input id="circle-size" aria-label="Tamaño del círculo" type="range" min="10" max="160" value="40"></label></div></section>
<section class="canvas-frame" aria-label="Pizarra de prueba"><span class="grid-caption">Cuadrícula de apoyo</span><svg id="board-canvas" viewBox="0 0 1000 650" role="img" aria-label="Lienzo: elige una herramienta y dibuja" tabindex="0"><defs><pattern id="board-grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="var(--grid-line)" stroke-width="1"/></pattern></defs><rect width="1000" height="650" fill="url(#board-grid)" pointer-events="none"/><g id="board-items"></g></svg><div id="board-notice" class="board-notice" role="note" aria-live="off" hidden></div></section>
<footer class="board-footer"><p id="board-help">¡Crea, dibuja y comparte tus ideas!</p><div class="palette-wrap"><span>Colores</span><div id="palette" class="palette" aria-label="Colores de dibujo"></div></div><div id="board-actions" class="board-actions"></div></footer></main>
<script type="module" src="/src/boards/prueba/main.ts"></script></body></html>
