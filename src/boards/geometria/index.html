<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pizarra de geometría · Froebel Academy</title>
<style>:root{--bg:#f1f5fc;--cd:#fff;--tx:#1b2a41;--mu:#5b6b85;--bd:#d3dcee;--pr:#1f5fbf;--ac:#fff3d6;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
@media(prefers-color-scheme:dark){:root{--bg:#0f1520;--cd:#1a2333;--tx:#e6ecf7;--mu:#9fb0cc;--bd:#2f3b52;--pr:#6aa2ff;--ac:#3a3220}}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif;display:flex;flex-direction:column}
#top{background:#1f5fbf;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:6px 8px;gap:6px;flex-wrap:wrap}
#top b{font-size:15px}button{border:1px solid var(--bd);border-radius:8px;padding:5px 9px;background:var(--cd);color:var(--tx);font:inherit;cursor:pointer}
#top button{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4);color:#fff}
button.on{background:#facc15!important;color:#222!important;border-color:#facc15!important}
.row{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:5px 8px;background:var(--cd);border-bottom:1px solid var(--bd)}
.row span{color:var(--mu)}#bd{flex:1;min-height:0;margin:6px 10px}svg{width:100%;height:100%;background:var(--cd);border:2px solid var(--bd);border-radius:10px;touch-action:none;display:block}
#bot{max-height:36vh;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:0 8px 6px}
#owl{background:var(--ac);border-radius:10px;padding:6px 10px}.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--bd);padding:0}.sw.sel{box-shadow:0 0 0 3px var(--pr)}
input[type=text]{border:1px solid var(--bd);border-radius:8px;padding:5px;background:var(--cd);color:var(--tx);width:120px}
body.big .hid{display:none}body.big #bot{max-height:30vh}body.big #bd{margin:2px 4px}body.noopt #tabs,body.noopt #tools,body.noopt #bot{display:none}body.ro svg{pointer-events:none}body.ro #tabs,body.ro #tools,body.ro #bot{pointer-events:none;opacity:.5}body.ro #top button:not(#bCls){pointer-events:none;opacity:.4}</style><link rel="stylesheet" href="/src/boards/geometria/geometry.css"></head><body>
<header id="top"><a class="geo-brand" href="/" aria-label="Froebel Academy, inicio"><img src="/src/assets/img/header-mobile.webp" alt="Froebel Academy"></a><b>🔺 Pizarra de geometría · Froebel Academy</b><div><span id="st" style="font-size:12px"></span> <button id="bCls" style="display:none">👥 Clase</button> <button id="bGa">📚 Fórmulas</button> <button id="bOp">🙈 Ocultar opciones</button> <button id="bBig">🔍 Pizarra grande</button> <button id="bUn">↩ Deshacer</button> <button id="bSn">🧲 Imán</button> <button id="bCl">🗑️ Limpiar</button></div><div id="live-slot"></div></header>
<main id="geometry-workspace"><div id="ban" style="display:none;background:#facc15;color:#222;padding:5px 8px;align-items:center;gap:8px"><span></span><button id="bBk">↩ Volver a mi pizarra</button></div><div class="row" id="tabs"></div><div class="row" id="tools"></div>
<div id="bd"><svg role="img" aria-label="Pizarra de geometría interactiva" tabindex="0" id="sv" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet"><defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#9aa8c4" stroke-opacity=".35" stroke-width=".6"/></pattern></defs><rect width="1000" height="560" fill="url(#g)"/><g id="L"></g><g id="P" pointer-events="none"></g></svg></div>
<div id="bot"><div id="owl" class="hid"></div><div class="row" id="cols" style="border:0;padding:0"></div><div class="row" id="ctx" style="border:0;padding:0"></div></div>
</main><div id="cls" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto"></div><div id="gal" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:9;overflow:auto"></div>
<script type="module" src="/src/boards/geometria/main.js"></script></body></html>
