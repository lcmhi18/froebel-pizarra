<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#007aff"><title>Froebel Academy · Profesores</title><link rel="icon" type="image/webp" href="/src/assets/img/header-mobile.webp"></head><body>
<div id="loading" role="status">Comprobando tu sesión…</div>
<main class="welcome" hidden><div class="scene" role="img" aria-label="Froebel Academy. Aprender jugando es el mejor camino."></div><section class="login" aria-labelledby="login-title"><div class="brand" role="img" aria-label="Froebel Academy"></div><h1 id="login-title">Iniciar sesión</h1><p class="greeting">Bienvenido, profesor</p><form id="login-form"><label class="sr-only" for="email">Correo electrónico</label><div class="email-field"><span class="field-icon email-icon" aria-hidden="true"></span><input id="email" type="email" autocomplete="username" placeholder="Ingresa tu correo electrónico" required maxlength="254"></div><label class="sr-only" for="password">Contraseña</label><div class="password-field"><span class="field-icon password-icon" aria-hidden="true"></span><input id="password" type="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" required maxlength="256"><button id="toggle-password" type="button" aria-label="Mostrar contraseña" aria-pressed="false">Ver</button></div><button class="submit" type="submit"><span class="submit-icon" aria-hidden="true"></span><span id="submit-label">Iniciar sesión</span> <span aria-hidden="true">→</span></button><p id="status" class="status" role="status" aria-live="polite"></p></form><button id="auth-mode" class="auth-mode" type="button">¿Eres nuevo? Regístrate como profesor</button><div class="security-note"><span class="security-icon" aria-hidden="true"></span><div><strong>Protegemos tu acceso</strong><p>Usamos una conexión segura para proteger tu información.</p></div></div><p class="assistance">¿Necesitas ayuda? Contacta al administrador.</p></section></main>
<div id="student-panel" hidden><header class="student-header"><picture><source media="(max-width: 760px)" srcset="/src/assets/img/header-mobile.webp"><img src="/src/assets/img/header.webp" alt="Froebel Academy"></picture><button id="notifications" aria-label="Notificaciones" aria-expanded="false"></button><button id="logout" aria-label="Salir"></button><div id="notification-panel" role="status" hidden>No tienes notificaciones nuevas.</div></header><div class="student-layout"><aside class="student-sidebar"><nav aria-label="Menú del profesor"><button data-view="home" aria-label="Inicio" aria-current="page"></button><button data-view="courses" aria-label="Cursos"></button></nav></aside><main class="student-main"><section id="home-screen" aria-label="Matemáticas"><picture class="math-hero"><source media="(max-width:760px)" srcset="/src/assets/img/hero-mobile.webp"><img src="/src/assets/img/hero-desktop.webp" alt="Matemáticas · Froebel Academy"></picture><div class="levels"><button data-level="primaria"><picture><source media="(max-width:760px)" srcset="/src/assets/img/primaria/portada.webp"><img src="/src/assets/img/primaria/portada-desktop.webp" alt="Primaria · Matemáticas"></picture></button><button data-level="secundaria"><picture><source media="(max-width:760px)" srcset="/src/assets/img/secundaria/portada.webp"><img src="/src/assets/img/secundaria/portada-desktop.webp" alt="Secundaria · Matemáticas"></picture></button></div></section><section id="level-screen" hidden><button id="back">← Volver a cursos</button><h1 id="level-title" tabindex="-1"></h1><p>Aún no hay juegos disponibles.</p><p><a href="/src/pages/profesor/index.html">Abrir pizarra en vivo</a></p></section><nav class="mobile-nav" aria-label="Menú del profesor"><img src="/src/assets/img/navigation-mobile.webp" alt=""><button data-view="home" aria-label="Inicio" aria-current="page"></button><button data-view="courses" aria-label="Cursos"></button></nav></main></div></div><script type="module" src="/src/main.js"></script></body></html>
